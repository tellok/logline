name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      target_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on:
      - self-hosted
      - tower
      - ubuntu-latest
      - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: node scripts/check-pr-context.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.source_sha }}
          EXPECTED_BASE: ${{ inputs.target_sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run docs:build
      - run: node scripts/check-pr-context.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.source_sha }}
          EXPECTED_BASE: ${{ inputs.target_sha }}

  vite-compatibility:
    name: Vite ${{ matrix.vite }} compatibility
    strategy:
      fail-fast: false
      matrix:
        vite: [5, 6, 7, 8]
    runs-on:
      - self-hosted
      - tower
      - ubuntu-latest
      - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: node scripts/check-pr-context.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.source_sha }}
          EXPECTED_BASE: ${{ inputs.target_sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:vite -- ${{ matrix.vite }}
      - run: node scripts/check-pr-context.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.source_sha }}
          EXPECTED_BASE: ${{ inputs.target_sha }}
