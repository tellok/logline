name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      target_sha:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/check-pr-context.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.source_sha }}
          EXPECTED_BASE: ${{ inputs.target_sha }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: node scripts/check-pr-context.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.source_sha }}
          EXPECTED_BASE: ${{ inputs.target_sha }}
