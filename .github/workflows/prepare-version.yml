name: Prepare version PR
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: version-preparation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: pending
        run: node scripts/release-contract.mjs
      - if: steps.pending.outputs.pending == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.pending.outputs.pending == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.pending.outputs.pending == 'true'
        run: pnpm run version:prepare
        env:
          GH_TOKEN: ${{ github.token }}
