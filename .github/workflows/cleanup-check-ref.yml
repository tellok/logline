name: Clean validation ref
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  clean:
    runs-on:
      - self-hosted
      - tower
      - ubuntu-latest
      - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/cleanup-check-ref.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
