name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged version-PR commit to verify or recover
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: beta-delivery
  cancel-in-progress: false
jobs:
  eligibility:
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: 'ubuntu-latest'
    outputs:
      eligible: ${{ steps.proof.outputs.eligible }}
      source_sha: ${{ steps.proof.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: proof
        run: node scripts/verify-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1::5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 20
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.eligibility.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
      - name: Load the default-branch npm publisher for recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git show "$RELEASE_WORKFLOW_SHA:scripts/publish-release.mjs" > scripts/publish-release.mjs
      - id: publish
        run: pnpm run release:beta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERIFIED_SHA: ${{ needs.eligibility.outputs.source_sha }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: tellok/actions/github-actions/github-release@9df224593aad286a012adc6760fa7de7cb175e22
        if: steps.publish.outputs.core_tag != ''
        with:
          source: ${{ needs.eligibility.outputs.source_sha }}
          tag: ${{ steps.publish.outputs.core_tag }}
          name: ${{ steps.publish.outputs.core_name }}
          notes-file: ${{ steps.publish.outputs.core_notes }}
          assets-file: ${{ steps.publish.outputs.core_assets }}
          prerelease: 'true'
          latest: 'false'
          github-token: ${{ github.token }}
      - uses: tellok/actions/github-actions/github-release@9df224593aad286a012adc6760fa7de7cb175e22
        if: steps.publish.outputs.reporter_tag != ''
        with:
          source: ${{ needs.eligibility.outputs.source_sha }}
          tag: ${{ steps.publish.outputs.reporter_tag }}
          name: ${{ steps.publish.outputs.reporter_name }}
          notes-file: ${{ steps.publish.outputs.reporter_notes }}
          assets-file: ${{ steps.publish.outputs.reporter_assets }}
          prerelease: 'true'
          latest: 'false'
          github-token: ${{ github.token }}

  server-image:
    needs: [eligibility, publish]
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ghcr.io/tellok/logline-server
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.eligibility.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the server's own prerelease tag
        id: release
        run: |
          tag="$(node -p "require('./packages/logline-server/package.json').version")"
          if gh release view "$tag" --json tagName --jq .tagName >/dev/null 2>&1; then
            target=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          else
            target=$(git rev-parse HEAD)
            gh release create "$tag" \
              --target "$target" \
              --prerelease \
              --latest=false \
              --title "logline-server $tag" \
              --notes "Self-hosted Logline server image (linux/amd64 and linux/arm64)."
          fi
          git merge-base --is-ancestor "$target" HEAD
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Preserve any previously published release index
        id: existing
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
        run: |
          image="$REPOSITORY:$RELEASE_TAG"
          if digest=$(oras resolve "$image" 2>"$RUNNER_TEMP/resolve-error"); then
            revision=$(oras manifest fetch "$REPOSITORY@$digest" | jq -er '.annotations["org.opencontainers.image.revision"]')
            test "$revision" = "$RELEASE_TARGET"
            if [[ "$RELEASE_TARGET" != "$SOURCE_SHA" ]]; then
              gh release view "$RELEASE_TAG" --json isPrerelease,assets | jq -e '
                .isPrerelease and
                (["logline-server.oci.tar.gz", "logline-server-deployment.tar.gz", "logline-server.sha256"]
                 - [.assets[] | select(.state == "uploaded") | .name] | length == 0)
              ' >/dev/null
              echo "reused=true" >> "$GITHUB_OUTPUT"
              echo "Reused the existing server release $RELEASE_TAG at $digest."
            fi
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -Eiq 'manifest unknown|name unknown|manifest_unknown|name_unknown|not found' "$RUNNER_TEMP/resolve-error"; then
            cat "$RUNNER_TEMP/resolve-error" >&2; exit 1
          else
            test "$RELEASE_TARGET" = "$SOURCE_SHA"
          fi
      - name: Publish both architectures in one image index
        if: steps.existing.outputs.digest == ''
        id: image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: .
          file: packages/logline-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REPOSITORY }}:${{ steps.release.outputs.tag }}
          outputs: type=image,push=true,oci-mediatypes=true
          labels: org.opencontainers.image.source=https://github.com/tellok/logline
          annotations: index:org.opencontainers.image.revision=${{ needs.eligibility.outputs.source_sha }}
      - name: Verify pulls and attach the same immutable OCI index and deployment assets
        if: steps.existing.outputs.reused != 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
        run: bash deploy/package-release-image.sh

  documentation:
    needs: [eligibility, publish]
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.eligibility.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        with:
          path: .vitepress/dist
          retention-days: 1
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Remove the consumed Pages transfer artifact
        if: always() && steps.pages-artifact.outputs.artifact_id != ''
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git show "$RELEASE_WORKFLOW_SHA:scripts/cleanup-pages-artifact.mjs" > scripts/cleanup-pages-artifact.mjs
          fi
          node scripts/cleanup-pages-artifact.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
