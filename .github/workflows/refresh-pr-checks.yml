name: Refresh PR checks
on:
  push:
    branches:
    - '**'
    - '!codex/ci/**'
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
permissions:
  contents: write
  pull-requests: read
  checks: write
  actions: write
concurrency:
  group: refresh-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  schedule:
    runs-on:
    - self-hosted
    - tower
    - ubuntu-latest
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - if: hashFiles('scripts/refresh-pr-checks.mjs') != ''
      run: node scripts/refresh-pr-checks.mjs
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TARGET_BRANCH: ${{ github.ref_name }}
