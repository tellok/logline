apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [server.yaml]
configMapGenerator:
  - name: logline-server-settings
    literals:
      - PORT=4318
      - LOGLINE_MCP_ENABLED=false
      - INGEST_CONCURRENCY=12
      - QUERY_CONCURRENCY=4
      - PROJECT_EVENTS_PER_MINUTE=60000
      - PROJECT_BYTES_PER_MINUTE=67108864
      - RETENTION_DAYS=30
      - MAX_BODY_BYTES=1048576
      - MAX_BATCH_EVENTS=500
